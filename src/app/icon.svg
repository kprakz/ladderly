<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f3f46"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#facc15" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Glow behind the goal -->
  <circle cx="256" cy="96" r="104" fill="url(#glow)"/>

  <!-- Ladder rising in perspective -->
  <g stroke="#ffffff" fill="none">
    <path d="M174 392 H338 M188 326 H324 M202 260 H310 M216 194 H296" stroke-width="22"/>
    <path d="M164 440 L222 168 M348 440 L290 168" stroke-width="28" stroke-linecap="round"/>
  </g>

  <!-- Goal star -->
  <path d="M256 44 C262 82 270 90 308 96 C270 102 262 110 256 148 C250 110 242 102 204 96 C242 90 250 82 256 44 Z" fill="url(#star)"/>
</svg>
